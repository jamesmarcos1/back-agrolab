name: agrolab
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: agrolab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute scripts/setup_local.py}
      POSTGRES_DB: agrolab
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrolab -d agrolab"]
      interval: 3s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://agrolab:${POSTGRES_PASSWORD}@db:5432/agrolab
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://agrolab:${POSTGRES_PASSWORD}@db:5432/agrolab
      SMTP_HOST: mailpit
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
  cleanup:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://agrolab:${POSTGRES_PASSWORD}@db:5432/agrolab
    command: ["python", "-m", "app.jobs.cleanup", "--loop"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres_data:
